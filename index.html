<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3학년 수강신청 🌸</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');

  :root {
    --pink-deep:  #E05C8A;
    --pink-main:  #F4789A;
    --pink-light: #FFB3C8;
    --pink-pale:  #FFF0F5;
    --pink-bg:    #FFF7FA;
    --white:      #FFFFFF;
    --gray-dark:  #3D2B35;
    --gray-mid:   #9B7B8A;
    --gray-light: #F2E8EC;
    --success:    #5CB97E;
    --warning:    #F5A623;
    --danger:     #E05C5C;
    --shadow:     0 4px 20px rgba(224,92,138,0.15);
    --radius:     18px;
    --radius-sm:  10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--pink-bg);
    color: var(--gray-dark);
    min-height: 100vh;
    padding-bottom: 40px;
  }

  header {
    background: linear-gradient(135deg, var(--pink-deep) 0%, var(--pink-main) 100%);
    color: white;
    padding: 22px 24px 18px;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 4px 16px rgba(224,92,138,0.3);
  }
  header h1 { font-size: 1.25rem; font-weight: 900; letter-spacing: -0.5px; }
  header .subtitle { font-size: 0.78rem; opacity: 0.88; margin-top: 2px; }
  #headerInfo {
    margin-top: 10px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
  }
  #headerStudentName { font-size: 0.85rem; color: white; font-weight: 700; }

  .card {
    background: var(--white);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 28px 24px;
    margin: 20px 16px;
  }
  .card-title {
    font-size: 1rem;
    font-weight: 900;
    color: var(--pink-deep);
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card-title .dot {
    width: 8px; height: 8px;
    background: var(--pink-main);
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* 스텝 표시 */
  .step-indicator {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-bottom: 24px;
  }
  .step-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--gray-light);
    transition: all 0.3s;
  }
  .step-dot.active { background: var(--pink-main); transform: scale(1.3); }
  .step-dot.done { background: var(--success); }
  .step-line { width: 28px; height: 2px; background: var(--gray-light); border-radius: 1px; }

  /* 안내 박스 */
  .info-box {
    background: var(--pink-pale);
    border-left: 4px solid var(--pink-main);
    border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    padding: 12px 16px;
    margin-bottom: 18px;
    font-size: 0.82rem;
    color: var(--gray-dark);
    line-height: 1.6;
  }
  .info-box strong { color: var(--pink-deep); }

  /* 학생 확인 배지 */
  .student-confirm {
    background: linear-gradient(135deg, var(--pink-pale), #FFF);
    border: 2px solid var(--pink-light);
    border-radius: 14px;
    padding: 14px 18px;
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .student-confirm .avatar {
    width: 42px; height: 42px;
    background: linear-gradient(135deg, var(--pink-main), var(--pink-deep));
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.2rem;
    flex-shrink: 0;
  }
  .student-confirm .name { font-size: 1rem; font-weight: 900; color: var(--gray-dark); }
  .student-confirm .sub { font-size: 0.75rem; color: var(--gray-mid); margin-top: 2px; }

  /* 입력 */
  .input-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 10px;
  }
  label {
    display: block;
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--gray-mid);
    margin-bottom: 5px;
  }
  input[type="number"], input[type="password"], input[type="text"] {
    width: 100%;
    border: 2px solid var(--gray-light);
    border-radius: var(--radius-sm);
    padding: 11px 14px;
    font-size: 1rem;
    font-family: inherit;
    color: var(--gray-dark);
    outline: none;
    transition: border-color 0.2s;
    -moz-appearance: textfield;
  }
  input::-webkit-outer-spin-button,
  input::-webkit-inner-spin-button { -webkit-appearance: none; }
  input:focus { border-color: var(--pink-main); }
  input.error { border-color: var(--danger); }

  /* 비밀번호 강도 */
  .pw-strength {
    height: 4px;
    background: var(--gray-light);
    border-radius: 2px;
    margin-top: 6px;
    overflow: hidden;
  }
  .pw-strength-bar {
    height: 100%;
    border-radius: 2px;
    transition: all 0.3s;
    width: 0;
  }
  .pw-hint { font-size: 0.72rem; color: var(--gray-mid); margin-top: 4px; }

  .btn {
    display: block;
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: var(--radius-sm);
    font-size: 1rem;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: transform 0.12s, box-shadow 0.12s;
    margin-top: 14px;
  }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .btn-primary {
    background: linear-gradient(135deg, var(--pink-main), var(--pink-deep));
    color: white;
    box-shadow: 0 4px 14px rgba(224,92,138,0.35);
  }
  .btn-primary:hover:not(:disabled) { box-shadow: 0 6px 20px rgba(224,92,138,0.45); }
  .btn-ghost {
    background: none;
    border: 2px solid var(--gray-light);
    color: var(--gray-mid);
    font-size: 0.88rem;
    margin-top: 8px;
  }
  .btn-logout {
    background: none;
    border: 2px solid rgba(255,255,255,0.5);
    color: white;
    padding: 5px 14px;
    font-size: 0.8rem;
    border-radius: 20px;
    cursor: pointer;
    font-family: inherit;
    font-weight: 700;
  }

  /* 수강신청 현황 뱃지 */
  .current-badge { display: flex; gap: 10px; margin-bottom: 20px; }
  .period-badge {
    flex: 1;
    background: var(--pink-pale);
    border-radius: 12px;
    padding: 12px 14px;
    text-align: center;
  }
  .period-badge .period-label { font-size: 0.72rem; font-weight: 700; color: var(--gray-mid); }
  .period-badge .period-value { font-size: 0.88rem; font-weight: 900; color: var(--pink-deep); margin-top: 3px; min-height: 20px; }
  .period-badge.selected { background: linear-gradient(135deg, var(--pink-light), var(--pink-pale)); border: 2px solid var(--pink-main); }

  /* 교시 탭 */
  .period-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 20px; }
  .period-tab {
    padding: 12px;
    border-radius: var(--radius-sm);
    text-align: center;
    cursor: pointer;
    border: 2px solid var(--gray-light);
    font-weight: 700;
    font-size: 0.9rem;
    transition: all 0.2s;
    background: white;
    color: var(--gray-mid);
  }
  .period-tab.active { border-color: var(--pink-main); background: var(--pink-pale); color: var(--pink-deep); }
  .period-tab.done::after { content: ' ✓'; color: var(--success); }
  .period-tab.locked { opacity: 0.45; cursor: not-allowed; }

  /* 강좌 그리드 */
  .courses-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .course-card {
    border: 2px solid var(--gray-light);
    border-radius: 14px;
    padding: 14px 12px;
    cursor: pointer;
    transition: all 0.18s;
    background: white;
    position: relative;
    text-align: center;
  }
  .course-card:hover:not(.full):not(.same) { border-color: var(--pink-light); box-shadow: 0 2px 10px rgba(224,92,138,0.15); transform: translateY(-1px); }
  .course-card.selected { border-color: var(--pink-main); background: var(--pink-pale); box-shadow: 0 3px 14px rgba(224,92,138,0.25); }
  .course-card.full { opacity: 0.5; cursor: not-allowed; background: var(--gray-light); }
  .course-card.same { opacity: 0.38; cursor: not-allowed; background: #f5f5f5; }
  .course-name { font-size: 0.85rem; font-weight: 700; color: var(--gray-dark); margin-bottom: 6px; line-height: 1.3; }
  .course-count { font-size: 0.72rem; color: var(--gray-mid); font-weight: 500; }
  .count-bar { width: 100%; height: 5px; background: var(--gray-light); border-radius: 3px; margin-top: 5px; overflow: hidden; }
  .count-bar-fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--pink-light), var(--pink-main)); transition: width 0.4s; }
  .count-bar-fill.full-bar { background: var(--danger); }
  .mini-badge {
    position: absolute; top: 6px; right: 6px;
    font-size: 0.6rem; font-weight: 700;
    padding: 2px 6px; border-radius: 10px; color: white;
  }
  .mini-badge.sel { background: var(--pink-deep); }
  .mini-badge.cl { background: var(--danger); }
  .mini-badge.sm { background: var(--gray-mid); }

  /* 완료 배너 */
  .complete-banner {
    background: linear-gradient(135deg, #5CB97E, #3DA868);
    color: white; border-radius: var(--radius);
    padding: 20px; text-align: center; margin-bottom: 16px;
  }
  .complete-banner h2 { font-size: 1.05rem; font-weight: 900; }
  .complete-banner p { font-size: 0.8rem; opacity: 0.9; margin-top: 3px; }

  /* 토스트 */
  #toast {
    position: fixed; bottom: 30px; left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--gray-dark); color: white;
    padding: 12px 22px; border-radius: 30px;
    font-size: 0.88rem; font-weight: 500;
    opacity: 0; transition: all 0.3s; z-index: 999;
    white-space: nowrap; max-width: 90vw; text-align: center;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.success { background: var(--success); }
  #toast.error { background: var(--danger); }

  .spinner {
    display: inline-block; width: 16px; height: 16px;
    border: 3px solid rgba(255,255,255,0.4); border-top-color: white;
    border-radius: 50%; animation: spin 0.7s linear infinite;
    vertical-align: middle; margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .lovely-tag { text-align: center; font-size: 0.72rem; color: var(--pink-light); margin-top: 14px; }

  .hidden { display: none !important; }
</style>
</head>
<body>

<!-- 헤더 -->
<header>
  <h1>🌸 3학년 수강신청</h1>
  <div class="subtitle">배움의 기쁨을 함께 · 러블리 파크</div>
  <div id="headerInfo" class="hidden">
    <span id="headerStudentName"></span>
    <button class="btn-logout" onclick="logout()">로그아웃</button>
  </div>
</header>

<!-- ═══════════════════════════════════════════ -->
<!-- STEP 1: 반+번호 입력                         -->
<!-- ═══════════════════════════════════════════ -->
<div id="step1">
  <div class="card">
    <div class="step-indicator">
      <div class="step-dot active" id="sd1"></div>
      <div class="step-line"></div>
      <div class="step-dot" id="sd2"></div>
      <div class="step-line"></div>
      <div class="step-dot" id="sd3"></div>
    </div>
    <div class="card-title"><span class="dot"></span>반과 번호를 입력하세요</div>
    <div class="input-row">
      <div>
        <label>반</label>
        <input type="number" id="inputClass" placeholder="예) 3" min="1" max="9"
               onkeydown="if(event.key==='Enter') checkStudent()">
      </div>
      <div>
        <label>번호</label>
        <input type="number" id="inputNum" placeholder="예) 15" min="1" max="27"
               onkeydown="if(event.key==='Enter') checkStudent()">
      </div>
    </div>
    <button class="btn btn-primary" id="btnCheck" onclick="checkStudent()">다음</button>
    <div class="lovely-tag">🩷 러블리파크 · 승평중학교</div>
  </div>
</div>

<!-- ═══════════════════════════════════════════ -->
<!-- STEP 2-A: 최초 비밀번호 설정                  -->
<!-- ═══════════════════════════════════════════ -->
<div id="step2a" class="hidden">
  <div class="card">
    <div class="step-indicator">
      <div class="step-dot done" id="sd1a"></div>
      <div class="step-line"></div>
      <div class="step-dot active" id="sd2a"></div>
      <div class="step-line"></div>
      <div class="step-dot" id="sd3a"></div>
    </div>
    <div class="card-title"><span class="dot"></span>비밀번호 설정 (최초 1회)</div>
    <div id="studentConfirmA" class="student-confirm">
      <div class="avatar">🌸</div>
      <div>
        <div class="name" id="confirmNameA"></div>
        <div class="sub">처음 로그인이에요! 비밀번호를 설정해주세요.</div>
      </div>
    </div>
    <div class="info-box">
      비밀번호는 <strong>4자리 이상</strong>으로 설정해주세요.<br>
      한번 설정한 비밀번호는 선생님만 초기화할 수 있어요.
    </div>
    <div>
      <label>새 비밀번호</label>
      <input type="password" id="inputPwNew" placeholder="4자리 이상 입력"
             oninput="checkPwStrength()" onkeydown="if(event.key==='Enter') document.getElementById('inputPwConfirm').focus()">
      <div class="pw-strength"><div class="pw-strength-bar" id="pwStrengthBar"></div></div>
      <div class="pw-hint" id="pwHint">영문, 숫자, 특수문자 조합을 추천해요</div>
    </div>
    <div style="margin-top:12px;">
      <label>비밀번호 확인</label>
      <input type="password" id="inputPwConfirm" placeholder="다시 입력"
             onkeydown="if(event.key==='Enter') setPassword()">
    </div>
    <button class="btn btn-primary" id="btnSetPw" onclick="setPassword()">비밀번호 설정하기</button>
    <button class="btn btn-ghost" onclick="goBackToStep1()">← 다시 입력</button>
  </div>
</div>

<!-- ═══════════════════════════════════════════ -->
<!-- STEP 2-B: 기존 비밀번호 로그인               -->
<!-- ═══════════════════════════════════════════ -->
<div id="step2b" class="hidden">
  <div class="card">
    <div class="step-indicator">
      <div class="step-dot done"></div>
      <div class="step-line"></div>
      <div class="step-dot active"></div>
      <div class="step-line"></div>
      <div class="step-dot"></div>
    </div>
    <div class="card-title"><span class="dot"></span>비밀번호를 입력하세요</div>
    <div id="studentConfirmB" class="student-confirm">
      <div class="avatar">🌸</div>
      <div>
        <div class="name" id="confirmNameB"></div>
        <div class="sub" id="confirmSubB"></div>
      </div>
    </div>
    <div>
      <label>비밀번호</label>
      <input type="password" id="inputPwLogin" placeholder="비밀번호 입력"
             onkeydown="if(event.key==='Enter') loginWithPassword()">
    </div>
    <button class="btn btn-primary" id="btnLogin" onclick="loginWithPassword()">로그인</button>
    <button class="btn btn-ghost" onclick="goBackToStep1()">← 다시 입력</button>
  </div>
</div>

<!-- ═══════════════════════════════════════════ -->
<!-- STEP 3: 수강신청 메인                         -->
<!-- ═══════════════════════════════════════════ -->
<div id="mainSection" class="hidden">
  <div class="card" style="padding-bottom:20px;">
    <div class="card-title"><span class="dot"></span>내 수강신청 현황</div>
    <div class="current-badge">
      <div class="period-badge" id="badge1">
        <div class="period-label">1교시</div>
        <div class="period-value" id="badgeVal1">미신청</div>
      </div>
      <div class="period-badge" id="badge2">
        <div class="period-label">2교시</div>
        <div class="period-value" id="badgeVal2">미신청</div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-title"><span class="dot"></span>강좌 선택</div>
    <div id="completeBanner" class="complete-banner hidden">
      <h2>🎉 수강신청 완료!</h2>
      <p>1, 2교시 모두 신청되었어요. 변경하려면 교시를 눌러주세요.</p>
    </div>
    <div class="period-tabs">
      <div class="period-tab active" id="tab1" onclick="selectPeriod(1)">1교시 선택</div>
      <div class="period-tab" id="tab2" id="tab2">2교시 선택</div>
    </div>
    <div class="courses-grid" id="coursesGrid"></div>
  </div>
</div>

<div id="toast"></div>

<script>
// ============================================================
// 설정
// ============================================================
const GAS_URL = 'YOUR_GAS_WEB_APP_URL'; // ← 여기 수정

const COURSES = [
  { name: 'AI인공지능',       emoji: '🤖' },
  { name: 'K-POP댄스',       emoji: '💃' },
  { name: '게임개발자',       emoji: '🎮' },
  { name: '레진공예가',       emoji: '🎨' },
  { name: '마술사',           emoji: '🪄' },
  { name: '바리스타',         emoji: '☕' },
  { name: '쇼콜라티에',       emoji: '🍫' },
  { name: '파티시에',         emoji: '🎂' },
  { name: '퍼스널컬러전문가', emoji: '🌈' },
  { name: '퍼퓸디자이너',     emoji: '🌸' }
];
const MAX = 27;

// ── 상태 ──
let student = null;
let myP1 = null, myP2 = null;
let counts = { p1: Array(10).fill(0), p2: Array(10).fill(0) };
let currentPeriod = 1;
let isLoading = false;
let tempStudent = null; // 로그인 중 임시 저장

// ============================================================
// STEP 1: 학생 확인
// ============================================================
async function checkStudent() {
  const classNum = document.getElementById('inputClass').value.trim();
  const num = document.getElementById('inputNum').value.trim();
  if (!classNum || !num) { showToast('반과 번호를 모두 입력해주세요', 'error'); return; }

  setBtnLoading('btnCheck', true, '확인 중...');
  try {
    const res = await gasPost({ action: 'checkStudent', grade: 3, classNum, studentNum: num });
    if (res.success) {
      tempStudent = { grade: 3, classNum, studentNum: num, studentName: res.studentName };
      if (res.hasPassword) {
        showStep('step2b');
        document.getElementById('confirmNameB').textContent = `3학년 ${classNum}반 ${num}번 ${res.studentName}`;
        document.getElementById('confirmSubB').textContent = '비밀번호를 입력해 로그인하세요';
        setTimeout(() => document.getElementById('inputPwLogin').focus(), 100);
      } else {
        showStep('step2a');
        document.getElementById('confirmNameA').textContent = `3학년 ${classNum}반 ${num}번 ${res.studentName}`;
        setTimeout(() => document.getElementById('inputPwNew').focus(), 100);
      }
    } else {
      showToast(res.message, 'error');
    }
  } catch(e) {
    showToast('서버 연결에 실패했어요. GAS URL을 확인해주세요.', 'error');
  }
  setBtnLoading('btnCheck', false, '다음');
}

// ============================================================
// STEP 2-A: 비밀번호 설정
// ============================================================
function checkPwStrength() {
  const pw = document.getElementById('inputPwNew').value;
  const bar = document.getElementById('pwStrengthBar');
  const hint = document.getElementById('pwHint');
  let score = 0;
  if (pw.length >= 4) score++;
  if (pw.length >= 8) score++;
  if (/[A-Za-z]/.test(pw) && /[0-9]/.test(pw)) score++;
  if (/[^A-Za-z0-9]/.test(pw)) score++;

  const configs = [
    { w: '0%',   color: 'var(--gray-light)', text: '비밀번호를 입력해주세요' },
    { w: '30%',  color: 'var(--danger)',      text: '너무 짧아요 — 4자리 이상 필요해요' },
    { w: '55%',  color: 'var(--warning)',     text: '보통이에요' },
    { w: '78%',  color: 'var(--pink-main)',   text: '좋아요 👍' },
    { w: '100%', color: 'var(--success)',     text: '완벽해요 🎉' },
  ];
  const c = configs[score];
  bar.style.width = c.w;
  bar.style.background = c.color;
  hint.textContent = c.text;
}

async function setPassword() {
  const pw = document.getElementById('inputPwNew').value;
  const pw2 = document.getElementById('inputPwConfirm').value;
  if (pw.length < 4) { showToast('비밀번호는 4자리 이상이어야 해요', 'error'); return; }
  if (pw !== pw2) { showToast('비밀번호가 일치하지 않아요 🥲', 'error'); document.getElementById('inputPwConfirm').classList.add('error'); return; }
  document.getElementById('inputPwConfirm').classList.remove('error');

  setBtnLoading('btnSetPw', true, '설정 중...');
  try {
    const res = await gasPost({ action: 'setPassword', ...tempStudent, password: pw });
    if (res.success) {
      showToast('비밀번호 설정 완료! 🎉', 'success');
      student = tempStudent;
      await loadStatusAndShowMain();
    } else {
      showToast(res.message, 'error');
    }
  } catch(e) {
    showToast('오류가 발생했어요.', 'error');
  }
  setBtnLoading('btnSetPw', false, '비밀번호 설정하기');
}

// ============================================================
// STEP 2-B: 비밀번호 로그인
// ============================================================
async function loginWithPassword() {
  const pw = document.getElementById('inputPwLogin').value;
  if (!pw) { showToast('비밀번호를 입력해주세요', 'error'); return; }

  setBtnLoading('btnLogin', true, '로그인 중...');
  try {
    const res = await gasPost({ action: 'login', ...tempStudent, password: pw });
    if (res.success) {
      student = tempStudent;
      await loadStatusAndShowMain();
    } else {
      showToast(res.message, 'error');
      document.getElementById('inputPwLogin').classList.add('error');
      setTimeout(() => document.getElementById('inputPwLogin').classList.remove('error'), 1500);
    }
  } catch(e) {
    showToast('오류가 발생했어요.', 'error');
  }
  setBtnLoading('btnLogin', false, '로그인');
}

// ============================================================
// 현황 로드 + 메인 표시
// ============================================================
async function loadStatusAndShowMain() {
  const res = await gasPost({ action: 'getStatus', ...student });
  if (res.success) {
    myP1 = res.period1 !== null ? Number(res.period1) : null;
    myP2 = res.period2 !== null ? Number(res.period2) : null;
    counts = res.counts;
  }
  showStep('mainSection');
  document.getElementById('headerInfo').classList.remove('hidden');
  document.getElementById('headerStudentName').textContent =
    `3학년 ${student.classNum}반 ${student.studentNum}번 ${student.studentName}`;
  currentPeriod = (myP1 === null) ? 1 : 2;
  renderAll();
}

// ============================================================
// 네비게이션
// ============================================================
function showStep(stepId) {
  ['step1','step2a','step2b','mainSection'].forEach(id => {
    document.getElementById(id).classList.toggle('hidden', id !== stepId);
  });
}

function goBackToStep1() {
  tempStudent = null;
  document.getElementById('inputPwNew').value = '';
  document.getElementById('inputPwConfirm').value = '';
  document.getElementById('inputPwLogin').value = '';
  document.getElementById('pwStrengthBar').style.width = '0';
  showStep('step1');
}

function logout() {
  student = null; tempStudent = null;
  myP1 = null; myP2 = null;
  counts = { p1: Array(10).fill(0), p2: Array(10).fill(0) };
  document.getElementById('headerInfo').classList.add('hidden');
  document.getElementById('inputClass').value = '';
  document.getElementById('inputNum').value = '';
  document.getElementById('inputPwLogin').value = '';
  showStep('step1');
}

// ============================================================
// 교시 선택
// ============================================================
function selectPeriod(p) {
  if (p === 2 && myP1 === null) {
    showToast('1교시를 먼저 신청해주세요 🌸', '');
    return;
  }
  currentPeriod = p;
  renderAll();
}

// ============================================================
// 렌더링
// ============================================================
function renderAll() {
  // 뱃지
  const b1 = document.getElementById('badge1'), v1 = document.getElementById('badgeVal1');
  const b2 = document.getElementById('badge2'), v2 = document.getElementById('badgeVal2');
  if (myP1 !== null) { v1.textContent = COURSES[myP1].emoji+' '+COURSES[myP1].name; b1.classList.add('selected'); }
  else { v1.textContent = '미신청'; b1.classList.remove('selected'); }
  if (myP2 !== null) { v2.textContent = COURSES[myP2].emoji+' '+COURSES[myP2].name; b2.classList.add('selected'); }
  else { v2.textContent = '미신청'; b2.classList.remove('selected'); }

  // 완료 배너
  document.getElementById('completeBanner').classList.toggle('hidden', !(myP1 !== null && myP2 !== null));

  // 탭
  const t1 = document.getElementById('tab1');
  const t2 = document.getElementById('tab2');
  t1.className = 'period-tab' + (currentPeriod===1?' active':'') + (myP1!==null?' done':'');
  t2.className = 'period-tab' + (currentPeriod===2?' active':'') + (myP2!==null?' done':'') + (myP1===null?' locked':'');
  t1.onclick = () => selectPeriod(1);
  t2.onclick = () => selectPeriod(2);

  // 강좌 그리드
  const periodCounts = currentPeriod === 1 ? counts.p1 : counts.p2;
  const myChoice = currentPeriod === 1 ? myP1 : myP2;
  const otherChoice = currentPeriod === 1 ? myP2 : myP1;

  document.getElementById('coursesGrid').innerHTML = COURSES.map((c, i) => {
    const cnt = periodCounts[i] || 0;
    const isFull = cnt >= MAX && myChoice !== i;
    const isSame = otherChoice === i;
    const isSel = myChoice === i;
    const pct = Math.min(100, (cnt / MAX) * 100);

    let cls = 'course-card';
    let badge = '';
    if (isSel) { cls += ' selected'; badge = '<span class="mini-badge sel">✓ 선택</span>'; }
    else if (isSame) { cls += ' same'; badge = '<span class="mini-badge sm">타교시</span>'; }
    else if (isFull) { cls += ' full'; badge = '<span class="mini-badge cl">마감</span>'; }

    const clickable = !isFull && !isSame;
    return `<div class="${cls}" ${clickable?`onclick="register(${i})"`:''}>${badge}
      <div class="course-name">${c.emoji}<br>${c.name}</div>
      <div class="course-count">${cnt} / ${MAX}명</div>
      <div class="count-bar"><div class="count-bar-fill${isFull?' full-bar':''}" style="width:${pct}%"></div></div>
    </div>`;
  }).join('');
}

// ============================================================
// 수강신청
// ============================================================
async function register(idx) {
  if (isLoading) return;
  if (currentPeriod === 2 && myP1 === null) { showToast('1교시를 먼저 신청해주세요 🌸', ''); return; }
  isLoading = true;
  const isChange = (currentPeriod === 1 ? myP1 : myP2) !== null;
  showToast(`${currentPeriod}교시 ${COURSES[idx].name} ${isChange?'변경':'신청'} 중...`, '');
  try {
    const res = await gasPost({ action: 'register', ...student, period: currentPeriod, courseIndex: idx });
    if (res.success) {
      if (currentPeriod === 1) myP1 = idx; else myP2 = idx;
      counts = res.counts;
      showToast(res.message, 'success');
      if (currentPeriod === 1 && myP2 === null) {
        setTimeout(() => { currentPeriod = 2; renderAll(); }, 800);
      } else {
        renderAll();
      }
    } else {
      showToast(res.message, 'error');
    }
  } catch(e) { showToast('오류가 발생했어요.', 'error'); }
  isLoading = false;
}

// ============================================================
// 유틸
// ============================================================
async function gasPost(data) {
  const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(data) });
  return await res.json();
}

function setBtnLoading(id, loading, label) {
  const btn = document.getElementById(id);
  if (!btn) return;
  btn.disabled = loading;
  btn.innerHTML = loading ? `<span class="spinner"></span>${label}` : label;
}

let toastTimer = null;
function showToast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show' + (type ? ' '+type : '');
  t.id = 'toast';
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = ''; t.id = 'toast'; }, 2800);
}
</script>
</body>
</html>
